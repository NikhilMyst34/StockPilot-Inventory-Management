{% extends 'base.html' %}{% block heading %}Stock {{'Inward' if kind=='INWARD' else 'Outward'}}{% endblock %}{% block content %}<section class="panel narrow"><h2>{{'Receive stock' if kind=='INWARD' else 'Issue stock'}}</h2><form method="post" class="stack-form"><label>Product<select name="product_id" required><option value="">Choose product</option>{% for p in products %}<option value="{{p.id}}">{{p.name}} · {{p.sku}} (available {{p.quantity}})</option>{% endfor %}</select></label><label>Quantity<input name="quantity" type="number" min="1" required></label><label>Note / reference<input name="note"></label><button class="btn primary">Record {{kind.lower()}}</button></form></section>{% endblock %}
