```html
{% extends 'base.html' %}
{% block heading %}Edit Supplier{% endblock %}
{% block content %}
<section class="panel">
    <h2>Edit Supplier Details</h2>

    <form method="POST">
        <label>Name</label>
        <input name="name" value="{{ supplier.name }}" required>

        <label>Company Name</label>
        <input name="company_name"
               value="{{ supplier.company_name }}">

        <label>Contact Person</label>
        <input name="contact_person"
               value="{{ supplier.contact_person }}">

        <label>Phone</label>
        <input name="phone" value="{{ supplier.phone }}">

        <label>Email</label>
        <input name="email" value="{{ supplier.email }}">

        <label>Address</label>
        <textarea name="address">{{ supplier.address }}</textarea>

        <button type="submit">Save Changes</button>
        <a href="{{ url_for('suppliers') }}">Cancel</a>
    </form>
</section>
{% endblock %}
```
