<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><title>StockPilot Login</title></head><body class="login-page"><form method="post" class="login-card"><h1>📦 StockPilot</h1><p>Sign in to manage inventory</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert {{c}}">{{m}}</div>{% endfor %}{% endwith %}<label>Username<input name="username" required placeholder="admin"></label><label>Password<input type="password" name="password" required placeholder="••••••••"></label><button class="btn primary">Sign in</button><small>Demo: admin / admin123</small></form></body></html>
