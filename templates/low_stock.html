{% extends 'base.html' %}{% block heading %}Low Stock Alerts{% endblock %}{% block content %}<section class="panel"><h2>Items requiring attention</h2><table><tr><th>Product</th><th>SKU</th><th>Quantity</th><th>Minimum</th></tr>{% for p in products %}<tr><td>{{p.name}}</td><td>{{p.sku}}</td><td><span class="pill danger">{{p.quantity}} {{p.unit}}</span></td><td>{{p.min_stock_level}}</td></tr>{% else %}<tr><td colspan="4">No low-stock products.</td></tr>{% endfor %}</table></section>{% endblock %}
